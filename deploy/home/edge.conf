server {
    listen 8080;
    server_name _;
    client_max_body_size 80m;

    # Mike signs path-style S3 URLs under its fixed bucket name.
    # Reverse proxy the same path and Host so the S3 signature remains valid.
    location /mike/ {
        if ($args !~ "(^|&)X-Amz-Signature=[0-9A-Fa-f]{64}(&|$)") { return 403; }
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://storage:9000;
    }

    location = /mike { return 404; }
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_pass http://frontend:3000;
    }
}
